name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            python3-dev \
            gettext \
            libtool \
            pkg-config \
            unzip \
            zip \
            cmake \
            ninja-build \
            autotools-dev \
            autoconf \
            ccache \
            libzbar-dev \
            libzbar0 \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev \
            libpng-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "cython<3" buildozer virtualenv

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v5-

      - name: Build with Buildozer
        run: yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyton-detect-apk
          path: bin/*.apk
