name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build APK

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"


      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            gettext \
            autopoint \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      - name: Install Python build tools
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer \
            setuptools \
            "cython==0.29.34"


      - name: Prepare clean workspace
        run: |

          rm -rf .buildozer

          rm -rf bin


      - name: Build APK
        env:

          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"

          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

        run: |

          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: expiring-goods-apk

          path: bin/*.apk

          if-no-files-found: error
