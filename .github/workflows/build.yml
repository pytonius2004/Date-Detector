name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"


      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"


      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      - name: Prepare Android SDK
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "SDK manager:"
          sdkmanager --version

          echo "Android 35:"
          sdkmanager --list_installed | grep "platforms;android-35" || true

          echo "Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo "AIDL works."


      - name: Prepare legacy sdkmanager path
        run: |

          mkdir -p \
            "$ANDROID_SDK_ROOT/tools/bin"

          rm -f \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          ln -s \
            "$(command -v sdkmanager)" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo "Legacy sdkmanager:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" \
            --version


      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            gettext \
            autopoint \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.5.0

          python -m pip install setuptools

          python -m pip install \
            "cython==0.29.34"


      - name: Show versions
        run: |

          python --version

          buildozer --version

          java -version

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "sdkmanager:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" \
            --version


      - name: Clean Buildozer
        run: |

          rm -rf .buildozer

          rm -rf bin


      - name: Configure Google Sheets sync
        env:

          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}

          GOOGLE_SHEETS_SYNC_TOKEN: ${{ secrets.GOOGLE_SHEETS_SYNC_TOKEN }}

        run: |

          python scripts/generate_sheets_config.py


      - name: Build APK
        env:

          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"

          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}

          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

        run: |

          echo "Starting Buildozer..."

          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: expiring-goods-mlkit-debug

          path: bin/*.apk

          if-no-files-found: error
