name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-33 build-tools;34.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Prepare Android SDK for Buildozer
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Checking modern sdkmanager:"
          which sdkmanager || true
          sdkmanager --version

          echo "Checking AIDL:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/34.0.0/aidl"

          echo "Testing AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aidl" --help > /dev/null

          echo "AIDL is working."

          echo "Creating legacy SDK tools path required by old python-for-android..."

          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          rm -f "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          ln -s \
            "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo "Checking legacy sdkmanager path:"
          ls -la "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo "Testing legacy sdkmanager:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

          echo "Buildozer-compatible Android SDK is ready."

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            gettext \
            autopoint \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0
          python -m pip install setuptools
          python -m pip install "cython==0.29.34"

      - name: Show versions
        run: |
          python --version
          buildozer --version
          echo "Java:"
          java -version
          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"
          echo "sdkmanager:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

        run: |
          echo "Using Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "Checking Buildozer sdkmanager:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

          echo "Checking AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aidl" --help > /dev/null

          echo "Starting Buildozer..."

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expiring-goods-debug
          path: bin/*.apk
          if-no-files-found: error
